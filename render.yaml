# Render blueprint - deploys the StellarIQ Give API (Fastify) on the free tier.
# The web dashboard is deployed separately on Vercel and points at this API.
#
# Free-tier note: the service sleeps after ~15 min idle, so the first request
# after inactivity has a cold start (~30-60s). Fine for a demo.
services:
  - type: web
    name: stellariq-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_PORT
        value: '10000' # Render routes to this port
      - key: API_HOST
        value: '0.0.0.0'
      - key: API_KEY_SALT
        generateValue: true # Render generates a strong random value
      - key: DATA_API_URL
        value: 'https://stellariq-data-api.onrender.com' # live data service; app falls back to built-in data if it is unreachable
      - key: DONATIONS_CONTRACT_ID
        value: 'CBCHKIDRFJ4KO2DGJEP75NJPYN65YVD6QOVVHC5IU7PRTHGHW75OF2KX' # StellarIQ Give donations contract (testnet)
      - key: SOROBAN_RPC_URL
        value: 'https://soroban-testnet.stellar.org'
